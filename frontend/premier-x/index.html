<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0020">
<title>The Premier X</title>
<!-- the design's fonts (Barlow Condensed, Inter), served locally so the demo needs no outside network -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* the design boards are 390 x 844; the stage scales them to the window */
  html, body { margin: 0; height: 100%; background: #1A0020; }
  body { display: flex; align-items: flex-start; justify-content: center; overflow-x: hidden; }
  #stage { width: calc(390px * var(--k, 1)); height: calc(844px * var(--k, 1)); position: relative; flex: none; }
  #screen { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: scale(var(--k, 1)); transform-origin: 0 0; }
  @media (min-width: 501px) { body { align-items: center; } #stage { box-shadow: 0 30px 80px rgba(0,0,0,.55); border-radius: 18px; overflow: hidden; } }
  button { -webkit-tap-highlight-color: transparent; }
</style>
<style id="screen-css"></style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<noscript>The Premier X needs JavaScript.</noscript>
<script src="dc.js"></script>
<script src="pitch.js"></script>
<script src="app.js"></script>
</body>
</html>
